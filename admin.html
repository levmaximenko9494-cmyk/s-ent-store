<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SCENTÉVIA — Admin</title><style>
body{margin:0;background:#f5f1eb;color:#211d1a;font:14px Arial}main{max-width:1100px;margin:auto;padding:30px 20px}.brand{font:28px Georgia}.box{background:#fffdfa;border:1px solid #ddd5cc;padding:22px;margin:20px 0}input,select{padding:10px;border:1px solid #ccc;margin:4px}.btn{padding:10px 15px;background:#171310;color:#fff;border:0;cursor:pointer}.tabs button{padding:10px;margin-right:6px}.hidden{display:none}.order{border-top:1px solid #ddd;padding:15px 0}.status{padding:8px}.danger{background:#b4473c;color:white}.product-form{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.product-form label{display:grid;gap:4px;color:#766f68;font-size:12px}.product-form input{margin:0;min-width:0}.product-form .btn{align-self:end}.product-edit{background:#faf7f2;padding:16px;margin-top:12px}.partner-actions,.price-request-actions{display:flex;flex-wrap:wrap;align-items:center;gap:7px;margin-top:12px}.partner-actions button{padding:8px 11px}.partner-actions button:disabled,.btn:disabled{opacity:.45;cursor:not-allowed}.send-result{margin:8px 0 0}.supplier-card{background:#faf7f2;padding:16px;margin-top:12px}.supplier-row,.import-row,.offers-toolbar,.offers-pagination{display:flex;flex-wrap:wrap;align-items:end;gap:8px}.supplier-row label,.offers-toolbar label{display:grid;color:#766f68;font-size:12px}.offers-panel{margin-top:14px;padding:14px;border:1px solid #ddd5cc;background:white}.offers-table-wrap{overflow-x:auto}.offers-table{width:100%;border-collapse:collapse;margin:10px 0;min-width:940px}.offers-table th,.offers-table td{text-align:left;border-bottom:1px solid #eee;padding:7px;vertical-align:top}.offers-pagination{align-items:center;justify-content:flex-end}.preview{margin-top:14px;padding:14px;border:1px solid #ddd5cc;background:white}.preview table{width:100%;border-collapse:collapse;margin:10px 0}.preview th,.preview td{text-align:left;border-bottom:1px solid #eee;padding:7px}.muted{color:#766f68}@media(max-width:700px){.product-form{grid-template-columns:1fr}}</style></head><body><main>
<div class="brand">SCENTÉVIA · ADMIN</div>
<div id="login" class="box"><h2>Вход</h2><input id="email" placeholder="Email"><input id="pass" type="password" placeholder="Пароль"><button class="btn" onclick="login()">Войти</button><p id="err"></p></div>
<div id="panel" class="hidden"><div class="tabs"><button onclick="show('orders')">Заказы</button><button onclick="show('priceRequests')">Запросы прайс-листа</button><button onclick="show('partners')">Партнёры</button><button onclick="show('suppliers')">Поставщики</button><button onclick="show('products')">Товары</button><button onclick="logout()">Выйти</button></div>
<section id="orders" class="box"><h2>Заказы</h2><div id="ordersList"></div></section>
<section id="priceRequests" class="box hidden"><h2>Запросы прайс-листа</h2><div id="priceRequestsList"></div></section>
<section id="partners" class="box hidden"><h2>Партнёры</h2><div id="partnersList"></div></section>
<section id="suppliers" class="box hidden"><h2>Поставщики</h2><div class="supplier-row"><label>Название<input id="supplierName"></label><label>Наценка по умолчанию, %<input id="supplierMarkup" type="number" min="0" max="99999.99" step="0.01" value="0"></label><button class="btn" onclick="addSupplier()">Создать поставщика</button></div><p class="muted">Импортированные закупочные цены хранятся отдельно от публичного каталога.</p><div id="suppliersList"></div></section>
<section id="products" class="box hidden"><h2>Товары</h2><div id="productsList"></div><h3>Добавить товар</h3><div class="product-form"><label>Название<input id="pn" required></label><label>Категория<input id="pc" required></label><label>Ноты<input id="pt" required></label><label>Текущая цена<input id="pp" type="number" min="1" step="1" required></label><label>Остаток<input id="ps" type="number" min="0" step="1"></label><label>Бренд<input id="pb"></label><label>Объём<input id="pv" placeholder="100 мл"></label><label>Артикул<input id="psku"></label><label>Оптовая цена<input id="pw" type="number" min="0" step="1"></label><label>Минимальная партия<input id="pmq" type="number" min="1" step="1"></label><button class="btn" onclick="addProduct()">Добавить товар</button></div></section>
</div></main><script>
function getToken(){
  return localStorage.getItem("scent-admin-token");
}

const api=(u,o={})=>fetch(u,{...o,
  headers:{
    ...(!(o.body instanceof FormData)?{"Content-Type":"application/json"}:{}),
    ...(o.headers||{}),
    "Authorization":"Bearer "+getToken()
  }
});
function show(x){document.querySelectorAll("section").forEach(s=>s.classList.add("hidden"));document.getElementById(x).classList.remove("hidden");if(x==="orders")loadOrders();else if(x==="priceRequests")loadPriceRequests();else if(x==="partners")loadPartners();else if(x==="suppliers")loadSuppliers();else loadProducts()}
const escapeHtml=value=>String(value??"").replace(/[&<>"']/g,char=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[char]));
const formatDate=value=>new Intl.DateTimeFormat("ru-RU",{dateStyle:"medium",timeStyle:"short"}).format(new Date(value));
async function login(){

  let r = await fetch("/api/admin/login", {
    method:"POST",
    headers:{
      "Content-Type":"application/json"
    },
    body:JSON.stringify({
      email: email.value,
      password: pass.value
    })
  });

  let data = await r.json();


  if(data.token){
    localStorage.setItem("scent-admin-token", data.token);
    start();
  } else {
    alert(data.error || "Ошибка входа");
  }
}

function logout(){localStorage.removeItem("scent-admin-token");location.reload()}
async function loadOrders(){
  try{
    let r=await api("/api/admin/orders");
    if(r.status===401)return logout();
    let a;
    try{a=await r.json()}catch(e){a=null}
    if(!r.ok){
      ordersList.textContent=(a&&a.error)||"Не удалось загрузить заказы. Попробуйте позже.";
      return;
    }
    ordersList.innerHTML=a.length?a.map(o=>`<div class="order"><b>Заказ #${o.id}</b> · ${o.created_at}<br>${o.customer_name} · ${o.phone} · ${o.email}<br>${o.address}<br>${o.items.map(i=>`${i.name} × ${i.qty}`).join(", ")}<br><b>${o.total.toLocaleString("ru-RU")} ₽</b><br><select class="status" data-current="${o.status}" onchange="status(${o.id},this)">${["new","paid","processing","shipped","completed","cancelled"].map(s=>`<option ${s===o.status?"selected":""}>${s}</option>`).join("")}</select></div>`).join(""):"Заказов пока нет.";
  }catch(e){
    ordersList.textContent="Не удалось связаться с сервером. Проверьте подключение.";
  }
}
async function status(id,select){
  const previous=select.dataset.current;
  select.disabled=true;
  try{
    const r=await api("/api/admin/orders/"+id,{method:"PATCH",body:JSON.stringify({status:select.value})});
    if(r.status===401)return logout();
    let data={};
    try{data=await r.json()}catch(e){}
    if(!r.ok)throw new Error(data.error||"Не удалось изменить статус заказа");
    select.dataset.current=select.value;
  }catch(e){
    select.value=previous;
    alert(e.message||"Не удалось изменить статус заказа");
  }finally{
    select.disabled=false;
  }
}
async function loadPriceRequests(){
  try{
    const r=await api("/api/admin/price-requests");
    if(r.status===401)return logout();
    let requests;
    try{requests=await r.json()}catch(e){requests=null}
    if(!r.ok){priceRequestsList.textContent=(requests&&requests.error)||"Не удалось загрузить запросы.";return}
    priceRequestsList.innerHTML=requests.length?requests.map(item=>`<div class="order" data-price-request-id="${item.id}"><b>Запрос #${item.id}</b> · ${escapeHtml(formatDate(item.created_at))}<br><b>${escapeHtml(item.name)}</b> · ${escapeHtml(item.phone)} · ${escapeHtml(item.email)}<br>Компания / ИП: ${escapeHtml(item.company)||"—"}<br>Комментарий: ${escapeHtml(item.comment)||"—"}<br>Статус: <b data-role="request-status">${escapeHtml(item.status)}</b><div data-role="sent-details">${item.sent_at?`Отправлен: ${escapeHtml(formatDate(item.sent_at))}<br>Файл: ${escapeHtml(item.sent_file_name)||"—"}`:"Прайс ещё не отправлялся."}</div><div class="price-request-actions"><input data-role="price-file" type="file" accept=".xlsx,.xls,.pdf,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-excel,application/pdf"><button class="btn" onclick="sendPriceList(${item.id},this)">Отправить прайс</button></div><p class="send-result" data-role="send-result" aria-live="polite"></p></div>`).join(""):"Запросов пока нет.";
  }catch(e){
    priceRequestsList.textContent="Не удалось связаться с сервером. Проверьте подключение.";
  }
}
async function sendPriceList(id,button){
  const card=button.closest('[data-price-request-id]');
  const fileInput=card.querySelector('[data-role="price-file"]');
  const result=card.querySelector('[data-role="send-result"]');
  const file=fileInput.files[0];
  if(!file){result.textContent="Выберите XLSX, XLS или PDF-файл.";return}
  const form=new FormData();form.append("file",file);
  button.disabled=true;fileInput.disabled=true;result.textContent="Отправка письма…";
  try{
    const r=await api(`/api/admin/price-requests/${id}/send`,{method:"POST",body:form});
    if(r.status===401)return logout();
    let data={};
    try{data=await r.json()}catch(e){}
    if(!r.ok)throw new Error(data.error||"Не удалось отправить прайс-лист");
    card.querySelector('[data-role="request-status"]').textContent=data.status;
    card.querySelector('[data-role="sent-details"]').innerHTML=`Отправлен: ${escapeHtml(formatDate(data.sent_at))}<br>Файл: ${escapeHtml(data.sent_file_name)}`;
    fileInput.value="";
    result.textContent="Прайс-лист успешно отправлен клиенту.";
  }catch(e){result.textContent=e.message||"Не удалось отправить прайс-лист"}
  finally{button.disabled=false;fileInput.disabled=false}
}
async function loadPartners(){
  try{
    const r=await api("/api/admin/partners");
    if(r.status===401)return logout();
    let partners;
    try{partners=await r.json()}catch(e){partners=null}
    if(!r.ok){partnersList.textContent=(partners&&partners.error)||"Не удалось загрузить партнёров.";return}
    const labels={pending:"Ожидает",approved:"Одобрен",rejected:"Отклонён",blocked:"Заблокирован"};
    partnersList.innerHTML=partners.length?partners.map(partner=>`<div class="order"><b>${escapeHtml(partner.contact_name)}</b> · ${escapeHtml(partner.phone)} · ${escapeHtml(partner.email)}<br>Регистрация: ${escapeHtml(formatDate(partner.created_at))}<br>Статус: <b>${escapeHtml(labels[partner.status]||partner.status)}</b><div class="partner-actions"><button class="btn" ${partner.status==="approved"?"disabled":""} onclick="changePartnerStatus(${partner.id},'approved',this)">Одобрить</button><button ${partner.status==="rejected"?"disabled":""} onclick="changePartnerStatus(${partner.id},'rejected',this)">Отклонить</button><button class="danger" ${partner.status==="blocked"?"disabled":""} onclick="changePartnerStatus(${partner.id},'blocked',this)">Заблокировать</button></div></div>`).join(""):"Заявок партнёров пока нет.";
  }catch(e){
    partnersList.textContent="Не удалось связаться с сервером. Проверьте подключение.";
  }
}
async function changePartnerStatus(id,nextStatus,button){
  if(button.disabled)return;
  button.disabled=true;
  try{
    const r=await api(`/api/admin/partners/${id}/status`,{method:"PATCH",body:JSON.stringify({status:nextStatus})});
    if(r.status===401)return logout();
    let data={};
    try{data=await r.json()}catch(e){}
    if(!r.ok)throw new Error(data.error||"Не удалось изменить статус партнёра");
    await loadPartners();
  }catch(e){
    alert(e.message||"Не удалось изменить статус партнёра");
    button.disabled=false;
  }
}
async function loadSuppliers(){
  const list=document.getElementById("suppliersList");
  try{
    const r=await api("/api/admin/suppliers");
    if(r.status===401)return logout();
    const data=await r.json();
    if(!r.ok){list.textContent=data.error||"Не удалось загрузить поставщиков";return}
    list.innerHTML=data.length?data.map(supplier=>`<div class="supplier-card" data-supplier-id="${supplier.id}"><div class="supplier-row"><b>${escapeHtml(supplier.name)}</b><span>${supplier.active?"Активен":"Отключён"}</span><span>Предложений: ${supplier.active_offers_count} активных / ${supplier.offers_count} всего</span><label>Наценка по умолчанию, %<input data-role="markup" type="number" min="0" max="99999.99" step="0.01" value="${escapeHtml(supplier.default_markup_percent)}"></label><button onclick="saveSupplierMarkup(${supplier.id},this)">Сохранить наценку</button><button class="${supplier.active?"danger":"btn"}" onclick="toggleSupplier(${supplier.id},${!supplier.active},this)">${supplier.active?"Отключить":"Включить"}</button><button class="btn" onclick="toggleOffers(${supplier.id},this)">Предложения</button></div><div data-role="offers-output"></div><h4>Импорт XLSX</h4><div class="import-row"><input data-role="file" type="file" accept=".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"><button class="btn" onclick="previewImport(${supplier.id},this)">Предпросмотр</button></div><div data-role="import-output"></div></div>`).join(""):"Поставщиков пока нет.";
  }catch(e){list.textContent="Не удалось связаться с сервером."}
}
async function addSupplier(){
  const name=document.getElementById("supplierName");
  const markup=document.getElementById("supplierMarkup");
  const r=await api("/api/admin/suppliers",{method:"POST",body:JSON.stringify({name:name.value,default_markup_percent:markup.value})});
  const data=await r.json();
  if(!r.ok){alert(data.error||"Не удалось создать поставщика");return}
  name.value="";markup.value="0";await loadSuppliers();
}
async function saveSupplierMarkup(id,button){
  const card=button.closest(".supplier-card");
  button.disabled=true;
  try{
    const r=await api(`/api/admin/suppliers/${id}`,{method:"PATCH",body:JSON.stringify({default_markup_percent:card.querySelector('[data-role="markup"]').value})});
    const data=await r.json();
    if(!r.ok)throw new Error(data.error||"Не удалось сохранить наценку");
    await loadSuppliers();
  }catch(e){alert(e.message)}finally{button.disabled=false}
}
async function toggleSupplier(id,active,button){
  button.disabled=true;
  try{
    const r=await api(`/api/admin/suppliers/${id}`,{method:"PATCH",body:JSON.stringify({active})});
    const data=await r.json();
    if(!r.ok)throw new Error(data.error||"Не удалось изменить поставщика");
    await loadSuppliers();
  }catch(e){alert(e.message);button.disabled=false}
}
function formatPrice(value){
  if(value==null||value==="")return "—";
  const number=Number(value);
  return Number.isFinite(number)?number.toLocaleString("ru-RU",{minimumFractionDigits:2,maximumFractionDigits:2}):escapeHtml(value);
}
function formatPercent(value){
  const number=Number(value);
  return Number.isFinite(number)?number.toLocaleString("ru-RU",{maximumFractionDigits:2})+"%":"—";
}
async function toggleOffers(id,button){
  const output=button.closest(".supplier-card").querySelector('[data-role="offers-output"]');
  if(output.innerHTML){output.innerHTML="";button.textContent="Предложения";return}
  output.innerHTML=`<div class="offers-panel"><form class="offers-toolbar" onsubmit="searchOffers(${id},this);return false"><label>Поиск по артикулу или наименованию<input data-role="offers-search" type="search" maxlength="200"></label><label>Строк на странице<select data-role="offers-limit" onchange="changeOffersLimit(${id},this)"><option>25</option><option>50</option><option>100</option></select></label><button class="btn" type="submit">Найти</button><button type="button" onclick="clearOffersSearch(${id},this)">Сбросить</button></form><div data-role="offers-results"></div></div>`;
  button.textContent="Скрыть предложения";
  await loadSupplierOffers(id,1);
}
function offersPanel(id){
  return document.querySelector(`.supplier-card[data-supplier-id="${id}"] [data-role="offers-output"]`);
}
async function searchOffers(id,form){
  await loadSupplierOffers(id,1,form.querySelector('[data-role="offers-search"]').value);
}
async function clearOffersSearch(id,button){
  const form=button.closest("form");
  form.querySelector('[data-role="offers-search"]').value="";
  await loadSupplierOffers(id,1,"");
}
async function changeOffersLimit(id,select){
  await loadSupplierOffers(id,1,select.closest("form").querySelector('[data-role="offers-search"]').value);
}
async function loadSupplierOffers(id,page,search){
  const panel=offersPanel(id);
  if(!panel)return;
  const form=panel.querySelector("form");
  const results=panel.querySelector('[data-role="offers-results"]');
  const searchInput=form.querySelector('[data-role="offers-search"]');
  if(search!==undefined)searchInput.value=search;
  const params=new URLSearchParams({search:searchInput.value.trim(),page:String(page),limit:form.querySelector('[data-role="offers-limit"]').value});
  results.textContent="Загрузка предложений…";
  try{
    const r=await api(`/api/admin/suppliers/${id}/offers?${params}`);
    if(r.status===401)return logout();
    const data=await r.json();
    if(!r.ok)throw new Error(data.error||"Не удалось загрузить предложения");
    const rows=data.items.map(item=>`<tr><td>${escapeHtml(item.supplier_sku)}</td><td>${escapeHtml(item.original_name)}</td><td>${formatPrice(item.purchase_price)}</td><td>${escapeHtml(item.currency)}</td><td>${formatPercent(item.default_markup_percent)}</td><td>${formatPrice(item.automatic_sale_price)}</td><td>${item.active?"active":"inactive"}</td><td>${escapeHtml(formatDate(item.imported_at))}</td></tr>`).join("");
    const from=data.total?(data.page-1)*data.limit+1:0;
    const to=Math.min(data.page*data.limit,data.total);
    results.innerHTML=`<p>Найдено позиций: <b>${data.total}</b>${data.total?` · показаны ${from}–${to}`:""}</p><div class="offers-table-wrap"><table class="offers-table"><thead><tr><th>Артикул поставщика</th><th>Исходное наименование</th><th>Закупочная цена</th><th>Валюта</th><th>Наценка</th><th>Расчётная цена SCENTÉVIA</th><th>Статус</th><th>Последний импорт</th></tr></thead><tbody>${rows||'<tr><td colspan="8">Предложения не найдены.</td></tr>'}</tbody></table></div><div class="offers-pagination"><button ${data.page<=1?"disabled":""} onclick="loadSupplierOffers(${id},${data.page-1})">Назад</button><span>Страница ${data.totalPages?data.page:0} из ${data.totalPages}</span><button ${data.page>=data.totalPages?"disabled":""} onclick="loadSupplierOffers(${id},${data.page+1})">Вперёд</button></div>`;
  }catch(e){results.textContent=e.message||"Не удалось загрузить предложения"}
}
async function previewImport(id,button){
  const card=button.closest(".supplier-card");
  const file=card.querySelector('[data-role="file"]').files[0];
  const output=card.querySelector('[data-role="import-output"]');
  if(!file){alert("Выберите XLSX-файл");return}
  const form=new FormData();form.append("file",file);
  button.disabled=true;output.textContent="Чтение файла…";
  try{
    const r=await api(`/api/admin/suppliers/${id}/import-preview`,{method:"POST",body:form});
    if(r.status===401)return logout();
    const data=await r.json();
    if(!r.ok)throw new Error(data.error||"Не удалось подготовить предпросмотр");
    const rows=data.sample.map(item=>`<tr><td>${escapeHtml(item.supplier_sku)}</td><td>${escapeHtml(item.original_name)}</td><td>${escapeHtml(item.purchase_price)} ${escapeHtml(data.currency)}</td></tr>`).join("");
    output.innerHTML=`<div class="preview" data-preview-token="${escapeHtml(data.previewToken)}"><b>${escapeHtml(data.fileName)}</b><p>Колонки: ${data.foundColumns.map(escapeHtml).join(", ")} · Валюта: <b>${escapeHtml(data.currency)}</b></p><p>Корректных строк: <b>${data.validRows}</b> · Пропущено/ошибок: <b>${data.skippedRows}</b></p><table><thead><tr><th>Артикул</th><th>Наименование</th><th>Цена</th></tr></thead><tbody>${rows}</tbody></table><button class="btn" onclick="confirmImport(${id},this)">Подтвердить импорт</button> <span class="muted">Предпросмотр действует ${data.expiresInMinutes} минут.</span></div>`;
  }catch(e){output.textContent=e.message||"Ошибка предпросмотра"}finally{button.disabled=false}
}
async function confirmImport(id,button){
  const preview=button.closest(".preview");
  const token=preview.dataset.previewToken;
  button.disabled=true;
  try{
    const r=await api(`/api/admin/suppliers/${id}/import-confirm`,{method:"POST",body:JSON.stringify({previewToken:token})});
    if(r.status===401)return logout();
    const data=await r.json();
    if(!r.ok)throw new Error(data.error||"Не удалось выполнить импорт");
    preview.innerHTML=`<b>Импорт завершён</b><p>Обработано: ${data.processed} · Новых: ${data.created} · Изменили цену: ${data.priceChanged} · Без изменений: ${data.unchanged} · Деактивировано: ${data.deactivated} · Пропущено/ошибок: ${data.skipped}</p>`;
  }catch(e){alert(e.message);button.disabled=false}
}
async function loadProducts(){
  const r=await api("/api/admin/products");
  if(r.status===401)return logout();
  const products=await r.json();
  if(!r.ok){productsList.textContent=products.error||"Не удалось загрузить товары";return}
  const field=(label,name,value,type="text",attributes="")=>`<label>${label}<input data-field="${name}" type="${type}" value="${escapeHtml(value)}" ${attributes}></label>`;
  productsList.innerHTML=products.map(p=>`<div class="order product-edit" data-id="${p.id}"><div class="product-form">${field("Название","name",p.name)}${field("Категория","category",p.category)}${field("Ноты","notes",p.notes)}${field("Текущая цена","price",p.price,"number",'min="1" step="1"')}${field("Остаток","stock",p.stock,"number",'min="0" step="1"')}${field("Бренд","brand",p.brand)}${field("Объём","volume",p.volume)}${field("Артикул","sku",p.sku)}${field("Оптовая цена","wholesale_price",p.wholesale_price,"number",'min="0" step="1"')}${field("Минимальная партия","min_qty",p.min_qty,"number",'min="1" step="1"')}<button class="btn" onclick="updateProduct(${p.id},this)">Сохранить</button></div></div>`).join("");
}
async function addProduct(){
  const body={name:pn.value,category:pc.value,notes:pt.value,price:+pp.value,stock:+ps.value,brand:pb.value,volume:pv.value,sku:psku.value,wholesale_price:pw.value,min_qty:pmq.value};
  const r=await api("/api/admin/products",{method:"POST",body:JSON.stringify(body)});
  const data=await r.json();
  if(!r.ok){alert(data.error||"Не удалось добавить товар");return}
  [pn,pc,pt,pp,ps,pb,pv,psku,pw,pmq].forEach(input=>input.value="");
  loadProducts();
}
async function updateProduct(id,button){
  if(button.disabled)return;
  const container=button.closest(".product-edit");
  const get=name=>container.querySelector(`[data-field="${name}"]`).value;
  const body={name:get("name"),category:get("category"),notes:get("notes"),price:Number(get("price")),stock:Number(get("stock")),brand:get("brand"),volume:get("volume"),sku:get("sku"),wholesale_price:get("wholesale_price"),min_qty:get("min_qty")};
  button.disabled=true;
  try{
    const r=await api("/api/admin/products/"+id,{method:"PATCH",body:JSON.stringify(body)});
    const data=await r.json();
    if(!r.ok)throw new Error(data.error||"Не удалось сохранить товар");
    await loadProducts();
  }catch(e){alert(e.message)}finally{button.disabled=false}
}
function start(){loginBoxHide();show("orders")}function loginBoxHide(){document.getElementById("login").classList.add("hidden");document.getElementById("panel").classList.remove("hidden")}
const token = localStorage.getItem("scent-admin-token");if(token){start()}
</script></body></html>
